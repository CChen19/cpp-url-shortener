# TinyWebServer config overlay: Redis disabled (bench only).
# Usage: copy/merge over config/config.yaml for a deps-down run, e.g.
#   ./build-linux/server test_pressure/overlays/bench_redis_disabled.yaml
# Prefer starting from a full config; this file is a fragment documenting the knob.
# Full local overlay that inherits typical defaults:

server:
  port: 9006
  thread_num: 8
  trig_mode: 0
  opt_linger: false
  actor_model: 0

log:
  enabled: true
  async: false
  path: "./logs/server.redis-down.log"

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "shorturl"
  password: "shorturl"
  database: "shorturl"
  pool_size: 8

redis:
  enabled: false
  uri: "tcp://127.0.0.1:6379"
  connect_timeout_ms: 200
  socket_timeout_ms: 200

cache:
  ttl_seconds: 3600
  ttl_jitter_seconds: 300
  bloom_bits: 1048576
  bloom_hashes: 7

kafka:
  enabled: true
  brokers: "127.0.0.1:9092"
  click_topic: "shorturl.clicks"
  message_timeout_ms: 3000
  linger_ms: 5
  retries: 3

sharding:
  enabled: true
  database_prefix: "shorturl_"
  table_prefix: "short_url_"
  database_count: 4
  table_count: 4

observability:
  structured_log_enabled: true
  structured_log_path: "./logs/access.redis-down.jsonl"
