# TinyWebServer Configuration
server:
  port: 9006
  thread_num: 8
  trig_mode: 0          # 0=LT+LT, 1=LT+ET, 2=ET+LT, 3=ET+ET
  opt_linger: false
  actor_model: 0        # 0=main-thread I/O (only supported). 1=reactor is coerced to 0 at startup.
  public_base_url: "http://localhost:9006"  # minted short_url base; do not trust Host

log:
  enabled: true
  async: false
  path: "./logs/server.log"

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "shorturl"
  password: "shorturl"
  database: "shorturl"
  pool_size: 8
  # Fail GetConnection instead of blocking forever when the pool is exhausted.
  # Keep short (50-100ms): redirect/create should shed load rather than pile up.
  acquire_timeout_ms: 50

redis:
  enabled: true
  uri: "tcp://127.0.0.1:6379"
  connect_timeout_ms: 200
  socket_timeout_ms: 200

cache:
  ttl_seconds: 3600
  ttl_jitter_seconds: 300
  bloom_bits: 1048576
  bloom_hashes: 7
  # Default false: bloom miss is a hint, not a hard 404. Opt-in true is
  # single-process-only; warmup of unexpired codes can make later-expired
  # codes 404 instead of 410 until the process restarts.
  bloom_hard_filter: false
  local_shards: 16
  local_positive_bytes: 67108864   # 64 MiB; URL + metadata budget
  local_negative_bytes: 4194304    # 4 MiB; separate so random codes cannot flush hot positives
  local_negative_ttl_seconds: 30
  singleflight_max_inflight: 1024
  singleflight_max_waiters_per_key: 256

kafka:
  enabled: true
  brokers: "127.0.0.1:9092"
  click_topic: "shorturl.clicks"
  message_timeout_ms: 3000
  linger_ms: 5
  retries: 3

sharding:
  enabled: true
  database_prefix: "shorturl_"
  table_prefix: "short_url_"
  database_count: 4
  table_count: 4

observability:
  structured_log_enabled: true
  structured_log_path: "./logs/access.jsonl"
